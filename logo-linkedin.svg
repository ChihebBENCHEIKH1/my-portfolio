<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!--
    LinkedIn-optimized: everything centered within a ~200px radius
    so it survives the circle crop. The meteor wraps tighter.
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0e0e1a"/>
      <stop offset="100%" stop-color="#04040a"/>
    </radialGradient>

    <radialGradient id="headGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#e0e8ff" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stopww-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e8ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#a5b4fc" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="trail2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="warmTrail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="30" result="b3"/>
      <feMerge><feMergeNode in="b3"/><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="particle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Circle safe zone guide (not rendered) -->
    <!-- Everything important stays within r=220 from center (256,256) -->
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Stars (within safe zone) -->
  <g opacity="0.2">
    <circle cx="120" cy="130" r="0.8" fill="white"/>
    <circle cx="400" cy="150" r="0.7" fill="white"/>
    <circle cx="100" cy="300" r="0.6" fill="white"/>
    <circle cx="410" cy="350" r="0.8" fill="white"/>
    <circle cx="180" cy="420" r="0.6" fill="white"/>
    <circle cx="370" cy="420" r="0.7" fill="white"/>
    <circle cx="256" cy="90" r="0.7" fill="white"/>
    <circle cx="140" cy="200" r="0.5" fill="white"/>
    <circle cx="390" cy="250" r="0.6" fill="white"/>
  </g>

  <!-- ===== METEOR — centered, compact layout ===== -->

  <!-- Atmospheric glow -->
  <line x1="120" y1="110" x2="310" y2="240"
    stroke="#6366f1" stroke-width="50" stroke-linecap="round" opacity="0.035" filter="url(#soft)"/>

  <!-- Main trail — starts top-left of safe zone, ends at center-right -->
  <path d="M 120 110 Q 200 165, 310 240"
    stroke="url(#trail)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 132 102 Q 210 160, 316 234"
    stroke="url(#trail2)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 112 118 Q 192 172, 306 246"
    stroke="url(#warmTrail)" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Three shin fragments -->
  <g filter="url(#particle)">
    <!-- Fragment 1 -->
    <line x1="175" y1="150" x2="158" y2="108" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <circle cx="158" cy="106" r="3.5" fill="#a5b4fc" opacity="0.5"/>
    <circle cx="158" cy="106" r="1.5" fill="white" opacity="0.4"/>

    <!-- Fragment 2 (tallest) -->
    <line x1="220" y1="178" x2="210" y2="120" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
    <circle cx="210" cy="118" r="4" fill="#c084fc" opacity="0.55"/>
    <circle cx="210" cy="118" r="1.8" fill="white" opacity="0.45"/>

    <!-- Fragment 3 -->
    <line x1="268" y1="208" x2="262" y2="160" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <circle cx="262" cy="158" r="3.5" fill="#818cf8" opacity="0.45"/>
    <circle cx="262" cy="158" r="1.5" fill="white" opacity="0.35"/>
  </g>

  <!-- Debris -->
  <g filter="url(#particle)">
    <circle cx="148" cy="125" r="1.2" fill="#a5b4fc" opacity="0.15"/>
    <circle cx="195" cy="162" r="1.5" fill="#a5b4fc" opacity="0.15"/>
    <circle cx="240" cy="195" r="1" fill="#818cf8" opacity="0.2"/>
    <circle cx="285" cy="225" r="1.3" fill="#e879f9" opacity="0.12"/>
    <circle cx="170" cy="168" r="0.7" fill="#c084fc" opacity="0.2"/>
    <circle cx="300" cy="235" r="0.9" fill="#c084fc" opacity="0.15"/>
  </g>

  <!-- ===== METEOR HEAD — C curve, centered in frame ===== -->
  <g filter="url(#bloom)">
    <path d="
      M 310 240
      C 345 262, 370 295, 366 330
      C 362 365, 335 390, 290 398
      C 250 405, 218 395, 190 378
    " stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Inner bright core -->
  <path d="
    M 310 240
    C 345 262, 370 295, 366 330
    C 362 365, 335 390, 290 398
    C 250 405, 218 395, 190 378
  " stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Head glow -->
  <circle cx="310" cy="240" r="26" fill="url(#headGlow)" opacity="0.55"/>
  <circle cx="310" cy="240" r="7" fill="white" opacity="0.9" filter="url(#particle)"/>
  <circle cx="308" cy="238" r="2.5" fill="white"/>

  <!-- Tail glow -->
  <circle cx="190" cy="378" r="3.5" fill="#a5b4fc" opacity="0.45" filter="url(#particle)"/>
  <circle cx="190" cy="378" r="1.5" fill="white" opacity="0.3"/>
</svg>
