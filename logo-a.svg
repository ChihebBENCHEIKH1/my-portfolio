<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!--
    CONCEPT A: "THE ARCHITECT'S MARK"
    Two C's (Chiheb + Cheikh) interlocking — one faces right, one faces left.
    Together they form a portal/gateway shape. Clean, premium, no noise.
  -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#F2D680"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e8ec"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8c8d0"/>
    </linearGradient>
    <filter id="subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="0" y="0" width="512" height="512" rx="0"/>
    </clipPath>
  </defs>

  <!-- Deep black canvas -->
  <rect width="512" height="512" fill="#0a0a0a"/>

  <!-- Left C — opens right -->
  <path d="
    M 280 120
    A 148 148 0 1 0 280 392
  " stroke="url(#gold)" stroke-width="36" stroke-linecap="round" fill="none"/>

  <!-- Right C — opens left (mirrored) -->
  <path d="
    M 232 120
    A 148 148 0 1 1 232 392
  " stroke="url(#silver)" stroke-width="36" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Where they overlap creates a lens/vesica shape naturally -->

  <!-- Thin gold line accent -->
  <line x1="216" y1="460" x2="296" y2="460" stroke="url(#gold)" stroke-width="1" opacity="0.4"/>

  <!-- Name -->
  <text x="256" y="483" text-anchor="middle"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="10" fill="#C9A84C" letter-spacing="10" opacity="0.6">CHIHEB</text>
</svg>
