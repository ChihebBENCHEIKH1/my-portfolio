<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!--
    "SHAHAB — THE METEOR"
    A meteor streak tearing across a night sky.
    The 3 rising fragments reference the Arabic letter ش (shin).
    The head curves into a C. Your name's meaning as your mark.
  -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0e0e1a"/>
      <stop offset="100%" stop-color="#04040a"/>
    </radialGradient>

    <radialGradient id="headGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#e0e8ff" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e8ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#a5b4fc" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="trail2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="warmTrail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="30" result="b3"/>
      <feMerge><feMergeNode in="b3"/><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="particle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Night sky -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Distant stars -->
  <g opacity="0.2">
    <circle cx="420" cy="75" r="1" fill="white"/>
    <circle cx="82" cy="135" r="0.8" fill="white"/>
    <circle cx="465" cy="195" r="0.6" fill="white"/>
    <circle cx="48" cy="305" r="0.7" fill="white"/>
    <circle cx="395" cy="345" r="0.9" fill="white"/>
    <circle cx="125" cy="425" r="0.6" fill="white"/>
    <circle cx="445" cy="435" r="0.7" fill="white"/>
    <circle cx="195" cy="55" r="0.7" fill="white"/>
    <circle cx="70" cy="75" r="0.6" fill="white"/>
    <circle cx="485" cy="385" r="0.6" fill="white"/>
  </g>

  <!-- ===== THE METEOR ===== -->

  <!-- Wide atmospheric glow -->
  <line x1="65" y1="85" x2="330" y2="280"
    stroke="#6366f1" stroke-width="55" stroke-linecap="round" opacity="0.035" filter="url(#soft)"/>

  <!-- Main trail -->
  <path d="M 65 85 Q 180 170, 330 280"
    stroke="url(#trail)" stroke-width="5.5" stroke-linecap="round" fill="none"/>

  <!-- Secondary trails -->
  <path d="M 78 76 Q 195 165, 338 274"
    stroke="url(#trail2)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 55 94 Q 168 178, 326 288"
    stroke="url(#warmTrail)" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- ===== THREE FRAGMENTS — ش (shin) teeth rising from trail ===== -->
  <g filter="url(#particle)">
    <!-- Fragment 1 -->
    <line x1="160" y1="175" x2="140" y2="130" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <circle cx="140" cy="128" r="3.5" fill="#a5b4fc" opacity="0.5"/>
    <circle cx="140" cy="128" r="1.5" fill="white" opacity="0.4"/>

    <!-- Fragment 2 (tallest) -->
    <line x1="210" y1="200" x2="200" y2="140" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
    <circle cx="200" cy="138" r="4" fill="#c084fc" opacity="0.55"/>
    <circle cx="200" cy="138" r="1.8" fill="white" opacity="0.45"/>

    <!-- Fragment 3 -->
    <line x1="265" y1="230" x2="260" y2="178" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <circle cx="260" cy="176" r="3.5" fill="#818cf8" opacity="0.45"/>
    <circle cx="260" cy="176" r="1.5" fill="white" opacity="0.35"/>
  </g>

  <!-- Scattered debris -->
  <g filter="url(#particle)">
    <circle cx="115" cy="112" r="1.2" fill="#a5b4fc" opacity="0.15"/>
    <circle cx="145" cy="155" r="0.8" fill="#c084fc" opacity="0.2"/>
    <circle cx="185" cy="182" r="1.5" fill="#a5b4fc" opacity="0.15"/>
    <circle cx="230" cy="215" r="1" fill="#818cf8" opacity="0.2"/>
    <circle cx="248" cy="245" r="0.7" fill="#fbbf24" opacity="0.1"/>
    <circle cx="290" cy="260" r="1.3" fill="#e879f9" opacity="0.12"/>
    <circle cx="310" cy="273" r="0.9" fill="#c084fc" opacity="0.15"/>
  </g>

  <!-- ===== METEOR HEAD — curves into C ===== -->
  <g filter="url(#bloom)">
    <path d="
      M 330 280
      C 358 302, 382 332, 378 365
      C 374 398, 348 418, 305 425
      C 270 430, 240 422, 215 408
    " stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Inner bright core -->
  <path d="
    M 330 280
    C 358 302, 382 332, 378 365
    C 374 398, 348 418, 305 425
    C 270 430, 240 422, 215 408
  " stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Head glow -->
  <circle cx="330" cy="280" r="28" fill="url(#headGlow)" opacity="0.55"/>
  <circle cx="330" cy="280" r="7" fill="white" opacity="0.9" filter="url(#particle)"/>
  <circle cx="328" cy="278" r="2.5" fill="white"/>

  <!-- Tail glow -->
  <circle cx="215" cy="408" r="3.5" fill="#a5b4fc" opacity="0.45" filter="url(#particle)"/>
  <circle cx="215" cy="408" r="1.5" fill="white" opacity="0.3"/>

  <!-- ===== NAME ===== -->
  <text x="256" y="484" text-anchor="middle"
    font-family="'Georgia', 'Palatino Linotype', 'Book Antiqua', serif"
    font-size="13" font-weight="400" fill="white" letter-spacing="11" opacity="0.35">CHIHEB</text>
</svg>
